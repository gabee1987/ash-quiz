name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ashquiz
          POSTGRES_PASSWORD: ashquiz
          POSTGRES_DB: ashquiz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ashquiz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ashquiz:ashquiz@localhost:5432/ashquiz_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The real deliverable: the Docker image with Postgres, driven by Playwright like an event.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      APP_ORIGIN: http://localhost:3000
      SEED_ADMIN_USERNAME: e2e_admin
      SEED_ADMIN_PASSWORD: e2e-password-123
      E2E_USERNAME: e2e_admin
      E2E_PASSWORD: e2e-password-123
      E2E_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ash-quiz/web exec playwright install --with-deps chromium
      - run: docker compose up -d --build --wait
      - run: docker compose exec -T app node apps/server/dist/seed.js
      - run: curl -fsS http://localhost:3000/api/health
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
